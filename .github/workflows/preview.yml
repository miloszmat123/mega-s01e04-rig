name: Digest preview

on:
  workflow_dispatch:
    inputs:
      with_marker:
        description: Include the temporary course marker
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - name: Export the sample digest
        shell: bash
        env:
          LANE_ID: lane-07
          LANE_MARKER: ${{ inputs.with_marker && secrets.LANE_MARKER || '' }}
          WITH_MARKER: ${{ inputs.with_marker }}
        run: |
          if [ "$WITH_MARKER" != true ]; then unset LANE_MARKER; fi
          node --input-type=module <<'NODE'
          if (process.env.WITH_MARKER === 'true' && !process.env.LANE_MARKER?.trim()) {
            throw new Error('The requested preview requires LANE_MARKER.');
          }
          NODE
          mkdir -p "$RUNNER_TEMP/rig-preview"
          node --import tsx --input-type=module <<'NODE' >/dev/null 2>&1 &
          import { serve } from '@hono/node-server';
          import { createApp } from './src/app.tsx';
          serve({ fetch: createApp().fetch, hostname: '127.0.0.1', port: 8787 });
          NODE
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:8787/digest/2026-10-28 \
            --output "$RUNNER_TEMP/rig-preview/index.html"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { html } from 'hono/html';
          const page = readFileSync(`${process.env.RUNNER_TEMP}/rig-preview/index.html`, 'utf8');
          const marker = process.env.LANE_MARKER?.trim() || 'no marker set';
          if (!page.includes(`<span class="marker">${html`${marker}`}</span>`)) {
            throw new Error('The preview marker assertion failed.');
          }
          if (!page.includes('<span>lane-07</span>')) {
            throw new Error('The preview lane assertion failed.');
          }
          NODE
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        id: upload
        with:
          path: ${{ runner.temp }}/rig-preview
          retention-days: 1
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deploy
      - name: Delete the uploaded preview artifact
        if: ${{ always() && steps.upload.outputs.artifact_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID"
